version: 1
global_watched_paths:
- libs/python/**
- contracts/**
- config/cicd/**
- .github/workflows/**
- requirements*.txt
components:
- name: identity-service
  kind: python-service
  path: services/identity-service
  dockerfile: services/identity-service/Dockerfile
  image_suffix: identity-service
  test_command: python -m pytest -q
  migration_command: python -m alembic -c alembic.ini upgrade head
  deploy_service: identity-service
  watched_paths:
  - contracts/security-events.json
- name: academic-service
  kind: python-service
  path: services/academic-service
  dockerfile: services/academic-service/Dockerfile
  image_suffix: academic-service
  test_command: python -m pytest -q
