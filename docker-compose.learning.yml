services:
  learning-db:
    image: postgres:16
    environment:
      POSTGRES_DB: learning_db
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "${LEARNING_DB_PORT:-5440}:5432"
    volumes:
      - learning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  learning-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: learningadmin
      MINIO_ROOT_PASSWORD: learningsecret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - learning_object_data:/data

  learning-storage-init:
    image: minio/mc:latest
    depends_on:
      - learning-storage
    entrypoint: >
      /bin/sh -c "
      until mc alias set learning http://learning-storage:9000 learningadmin learningsecret; do sleep 2; done;
      mc mb -p learning/learning-resources || true;
      exit 0;
      "

  learning-migrate:
    build:
      context: ./services/learning-service
    environment:
      DATABASE_URL: postgresql+psycopg://learning:learning@learning-db:5432/learning_db
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      learning-db:
        condition: service_healthy

  learning-service:
    build:
      context: ./services/learning-service
    environment:
      DATABASE_URL: postgresql+psycopg://learning:learning@learning-db:5432/learning_db
      JWT_JWKS_URL: ${JWT_JWKS_URL:-http://identity-service:8000/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-smart-education-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smart-education-platform}
      JWT_ALGORITHMS: '["RS256"]'
      ACADEMIC_SERVICE_BASE_URL: ${ACADEMIC_SERVICE_BASE_URL:-http://academic-service:8000}
      ACADEMIC_INTERNAL_TOKEN: ${ACADEMIC_INTERNAL_TOKEN:-change-me-academic-internal-token}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://learning-storage:9000
      S3_BUCKET: learning-resources
      S3_ACCESS_KEY: learningadmin
      S3_SECRET_KEY: learningsecret
      S3_USE_SSL: "false"
      NOTIFICATION_SERVICE_BASE_URL: ${NOTIFICATION_SERVICE_BASE_URL:-http://notification-service:8000}
      NOTIFICATION_INTERNAL_EVENT_TOKEN: ${NOTIFICATION_INTERNAL_EVENT_TOKEN:-change-me-notification-internal-token}
    ports:
      - "8007:8000"
    depends_on:
      learning-migrate:
        condition: service_completed_successfully
      learning-storage-init:
        condition: service_completed_successfully

volumes:
  learning_postgres_data:
  learning_object_data:
