[project]
name = "smart-education-attendance-service"
version = "0.3.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a disposable attendance_test_* PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FA"]

[tool.ruff.format]
line-ending = "lf"
