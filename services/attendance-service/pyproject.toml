[project]
name = "smart-education-attendance-service"
version = "0.3.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a disposable attendance_test_* PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FA"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Path", "fastapi.Form", "fastapi.File", "app.security.authorization.require_roles", "app.security.auth.require_roles", "app.security.dependencies.require_roles"]
