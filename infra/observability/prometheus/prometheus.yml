global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: smart-education-platform

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: smartedu-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity-service:8000
        labels:
          service: identity-service
      - targets:
          - academic-service:8000
        labels:
          service: academic-service
      - targets:
          - attendance-service:8000
        labels:
          service: attendance-service
      - targets:
          - scheduling-service:8000
        labels:
          service: scheduling-service
      - targets:
          - notification-service:8000
        labels:
          service: notification-service
      - targets:
          - facility-service:8000
        labels:
          service: facility-service
      - targets:
          - learning-service:8000
        labels:
          service: learning-service
      - targets:
          - assessment-service:8000
        labels:
          service: assessment-service
      - targets:
          - reporting-service:8000
        labels:
          service: reporting-service
      - targets:
          - platform-service:8000
        labels:
          service: platform-service

  # RabbitMQ exposes Prometheus metrics on 15692 when rabbitmq_prometheus is enabled.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]


  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-cache
    static_configs:
      - targets: ["redis-cache-exporter:9121"]

  - job_name: redis-durable
    static_configs:
      - targets: ["redis-durable-exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]


  - job_name: api-gateway
    static_configs:
      - targets: ["gateway-exporter:9113"]
