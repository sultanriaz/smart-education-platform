worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;


    # Sprint 16 workflow context. Only safe correlation-id characters are trusted.
    map $http_x_correlation_id $correlation_id {
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
        default $request_id;
    }

    map $http_idempotency_key $has_idempotency_key {
        default 1;
        "" 0;
    }

    # Structured access logs for later centralized logging.
    log_format gateway_json escape=json
      '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"correlation_id":"$correlation_id",'
        '"traceparent":"$http_traceparent",'
        '"idempotency_key_present":$has_idempotency_key,'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
      '}';

    access_log /var/log/nginx/access.log gateway_json;
    error_log /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
