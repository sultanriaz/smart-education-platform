if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-Correlation-ID, X-Causation-ID, Idempotency-Key, traceparent" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Vary "Origin" always;
    return 204;
}

proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Correlation-ID $correlation_id;
proxy_set_header X-Causation-ID $http_x_causation_id;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header traceparent $http_traceparent;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

proxy_intercept_errors on;
error_page 502 503 504 = @upstream_unavailable;
error_page 429 = @rate_limited;

# The gateway owns these browser response headers. Avoid duplicate values from
# FastAPI CORS/context middleware, which browsers reject even when equal.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header X-Request-ID;
proxy_hide_header X-Correlation-ID;
