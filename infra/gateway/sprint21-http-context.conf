# Include in Nginx `http {}` context after reconciling with Sprint 16.
# Never use raw request paths or auth headers as metrics labels.

map $http_x_correlation_id $smartedu_correlation_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_correlation_id;
    default $request_id;
}

log_format smartedu_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"level":"INFO",'
      '"service":"api-gateway",'
      '"message":"http_request_completed",'
      '"request_id":"$request_id",'
      '"correlation_id":"$smartedu_correlation_id",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"remote_addr":"$remote_addr"'
    '}';

access_log /var/log/nginx/access.log smartedu_json;
