name: Supply Chain
on:
  pull_request:
  push: {branches: [main, master]}
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: {fail-on-severity: high}
  source-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install bandit pip-audit
      - run: python scripts/secret_scan.py . --strict
      - run: bandit -q -r services libs/python -x "*/tests/*"
      - name: Audit Python requirements
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do pip-audit -r "$file"; done < <(find services -name requirements.txt -type f | sort)
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
