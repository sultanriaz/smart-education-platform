name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to deploy
        required: true
        type: string
permissions:
  contents: read
  packages: read
  id-token: write
jobs:
  deploy:
    environment: staging
    runs-on: [self-hosted, staging]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e libs/python/smartedu_cicd
      - uses: sigstore/cosign-installer@v3
      - name: Download release assets
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          mkdir -p .release
          gh release download "${{ inputs.release_tag }}" --pattern release-manifest.json --pattern SHA256SUMS --dir .release
      - name: Verify manifest checksum
        shell: bash
        working-directory: .release
        run: sha256sum -c SHA256SUMS
      - run: python scripts/validate-release-manifest.py .release/release-manifest.json
      - name: Verify keyless image signatures
        run: python scripts/verify-release-signatures.py .release/release-manifest.json --repository "${{ github.repository }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy digest-pinned release
        shell: pwsh
        env:
          STAGING_COMPOSE_FILES: ${{ vars.STAGING_COMPOSE_FILES }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          STAGING_BACKUP_SCRIPT: ${{ vars.STAGING_BACKUP_SCRIPT }}
        run: ./scripts/deploy-staging.ps1 -Manifest ./.release/release-manifest.json -EnvironmentFile ./.env.staging
      - name: Sprint 19 live smoke
        if: vars.RUN_STAGING_LIVE_SMOKE == 'true'
        shell: pwsh
        run: ./scripts/run-live-contracts.ps1
