name: Learning Service CI

on:
  push:
    paths:
      - "services/learning-service/**"
      - ".github/workflows/learning-service-ci.yml"
  pull_request:
    paths:
      - "services/learning-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learning_test
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U learning -d learning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/learning-service
    env:
      DATABASE_URL: postgresql+psycopg://learning:learning@localhost:5440/learning_test
      TEST_POSTGRES_URL: postgresql+psycopg://learning:learning@localhost:5440/learning_test
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /tmp/learning-ci-objects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m alembic -c alembic.ini upgrade head
      - run: python -m alembic -c alembic.ini check
      - run: pytest -q
