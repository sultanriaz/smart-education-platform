name: Academic service CI

on:
  push:
    paths:
      - "services/academic-service/**"
      - "docker-compose.academic.yml"
      - ".github/workflows/academic-ci.yml"
  pull_request:
    paths:
      - "services/academic-service/**"
      - "docker-compose.academic.yml"
      - ".github/workflows/academic-ci.yml"

permissions:
  contents: read

jobs:
  academic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/academic-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academic_test_ci
          POSTGRES_USER: academic_test
          POSTGRES_PASSWORD: academic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academic_test -d academic_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACADEMIC_TEST_DATABASE_URL: postgresql+psycopg://academic_test:academic_test@localhost:5432/academic_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/academic-service/requirements*.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: docker compose -f ../../docker-compose.academic.yml config --quiet
      - run: docker build -t academic-service:ci .
