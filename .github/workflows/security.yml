name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  source-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Secret scan
        run: python scripts/secret_scan.py . --strict

      - name: Bandit
        run: bandit -q -r services libs/python -x "*/tests/*"

      - name: Container static audit
        run: python scripts/container_security_audit.py . --strict

      - name: Audit Python requirement files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Auditing $file"
            pip-audit -r "$file"
          done < <(find services -type f -name 'requirements.txt' | sort)

      - name: Shared security tests
        shell: bash
        run: |
          python -m pip install -e "libs/python/smartedu_security[dev]"
          pytest -q libs/python/smartedu_security/tests

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
