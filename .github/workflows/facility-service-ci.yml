name: Facility Service CI

on:
  push:
    paths:
      - "services/facility-service/**"
      - "docker-compose.facility.yml"
      - ".github/workflows/facility-service-ci.yml"
  pull_request:
    paths:
      - "services/facility-service/**"
      - "docker-compose.facility.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: facility_test
          POSTGRES_USER: facility
          POSTGRES_PASSWORD: facility
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facility -d facility_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/facility-service
    env:
      DATABASE_URL: postgresql+psycopg://facility:facility@localhost:5432/facility_test
      FACILITY_TEST_POSTGRES_URL: postgresql+psycopg://facility:facility@localhost:5432/facility_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/facility-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: pytest -q
