name: Deployment Architecture

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment toolkit
        run: |
          python -m pip install -e "libs/python/smartedu_deploy[dev]"

      - name: Toolkit tests
        run: pytest -q libs/python/smartedu_deploy/tests

      - name: Deployment manifest tests
        run: pytest -q tests/deployment

      - name: Production topology preflight
        run: python scripts/preflight-production.py

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Build production source manifests
        run: |
          kubectl kustomize deploy/kubernetes/production \
            > /tmp/smartedu-production-source.yaml
          test -s /tmp/smartedu-production-source.yaml

      - name: Ensure example secrets are not rendered
        shell: bash
        run: |
          if grep -q "REPLACE_WITH_SECRET_MANAGER_VALUE" \
            /tmp/smartedu-production-source.yaml; then
            echo "Example secrets leaked into Kustomize output."
            exit 1
          fi
