name: Reusable Container Check
on:
  workflow_call:
    inputs:
      component: {required: true, type: string}
      context: {required: true, type: string}
      dockerfile: {required: true, type: string}
permissions: {contents: read}
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: smartedu-ci/${{ inputs.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smartedu-ci/${{ inputs.component }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
