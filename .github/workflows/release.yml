name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      matrix: ${{ steps.plan.outputs.all }}
      migration_components: ${{ steps.migrations.outputs.components }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e libs/python/smartedu_cicd
      - id: meta
        shell: bash
        run: |
          git fetch origin main --tags --force
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.release_tag }}"; else TAG="$GITHUB_REF_NAME"; fi
          python scripts/validate-release-tag.py "$TAG" --require-ancestor-of origin/main
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-list -n 1 "$TAG")" >> "$GITHUB_OUTPUT"
      - id: plan
        run: python scripts/ci-plan.py --all --github-output "$GITHUB_OUTPUT"
      - id: migrations
        shell: bash
        run: echo "components=$(python scripts/detect-migration-components.py --tag '${{ steps.meta.outputs.release_tag }}')" >> "$GITHUB_OUTPUT"
  build-and-sign:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.validate.outputs.commit_sha }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/smartedu-${{ matrix.image_suffix }}"
          echo "repository=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ needs.validate.outputs.release_tag }}
            ${{ steps.image.outputs.repository }}:sha-${{ needs.validate.outputs.commit_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      - name: Keyless sign immutable image
        env: {COSIGN_YES: "true"}
        run: cosign sign "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Release fragment
        shell: bash
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          repo='${{ steps.image.outputs.repository }}'; digest='${{ steps.build.outputs.digest }}'
          Path('release-fragment.json').write_text(json.dumps({'component':'${{ matrix.name }}','repository':repo,'digest':digest,'immutable_ref':f'{repo}@{digest}'},indent=2)+chr(10))
          PY2
      - uses: actions/upload-artifact@v4
        with: {name: "release-fragment-${{ matrix.name }}", path: release-fragment.json, retention-days: 30}
  publish-release:
    needs: [validate, build-and-sign]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.validate.outputs.commit_sha }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e libs/python/smartedu_cicd
      - uses: actions/download-artifact@v4
        with: {pattern: "release-fragment-*", path: release-fragments, merge-multiple: true}
      - run: |
          python scripts/merge-release-fragments.py --fragments release-fragments --tag "${{ needs.validate.outputs.release_tag }}" --commit "${{ needs.validate.outputs.commit_sha }}" --repository "${{ github.repository }}" --migration-components "${{ needs.validate.outputs.migration_components }}" --output release-manifest.json
          python scripts/validate-release-manifest.py release-manifest.json
          sha256sum release-manifest.json > SHA256SUMS
      - name: Publish GitHub Release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh release create "${{ needs.validate.outputs.release_tag }}" --verify-tag --generate-notes release-manifest.json SHA256SUMS
