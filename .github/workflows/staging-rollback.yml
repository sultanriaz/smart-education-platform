name: Rollback Staging Application Images
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Previous release tag to restore
        required: true
        type: string
      confirm_schema_compatibility:
        description: I verified the current DB schema is compatible with the target release
        required: true
        type: boolean
permissions:
  contents: read
  packages: read
  id-token: write
jobs:
  rollback:
    if: inputs.confirm_schema_compatibility == true
    environment: staging
    runs-on: [self-hosted, staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e libs/python/smartedu_cicd
      - uses: sigstore/cosign-installer@v3
      - name: Download target release manifest
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          mkdir -p .release
          gh release download "${{ inputs.release_tag }}" --pattern release-manifest.json --pattern SHA256SUMS --dir .release
      - name: Verify release
        shell: bash
        run: |
          cd .release && sha256sum -c SHA256SUMS && cd ..
          python scripts/validate-release-manifest.py .release/release-manifest.json
          python scripts/verify-release-signatures.py .release/release-manifest.json --repository "${{ github.repository }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Roll back application images only
        shell: pwsh
        env:
          STAGING_COMPOSE_FILES: ${{ vars.STAGING_COMPOSE_FILES }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: ./scripts/rollback-staging.ps1 -Manifest ./.release/release-manifest.json -ConfirmSchemaCompatibility YES -EnvironmentFile ./.env.staging
