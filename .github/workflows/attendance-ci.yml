name: Attendance service CI

on:
  push:
    paths:
      - "services/attendance-service/**"
      - "docker-compose.attendance.yml"
      - ".github/workflows/attendance-ci.yml"
  pull_request:
    paths:
      - "services/attendance-service/**"
      - "docker-compose.attendance.yml"
      - ".github/workflows/attendance-ci.yml"

permissions:
  contents: read

jobs:
  attendance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/attendance-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: attendance_test_ci
          POSTGRES_USER: attendance_test
          POSTGRES_PASSWORD: attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance_test -d attendance_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ATTENDANCE_TEST_DATABASE_URL: postgresql+psycopg://attendance_test:attendance_test@localhost:5432/attendance_test_ci
      DATABASE_URL: postgresql+psycopg://attendance_test:attendance_test@localhost:5432/attendance_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/attendance-service/requirements*.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: docker compose -f ../../docker-compose.attendance.yml config --quiet
      - run: docker build -t attendance-service:ci .
