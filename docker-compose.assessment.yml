services:
  assessment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: assessment_db
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "${ASSESSMENT_DB_PORT:-5441}:5432"
    volumes:
      - assessment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  assessment-migrate:
    build:
      context: ./services/assessment-service
    environment:
      DATABASE_URL: postgresql+psycopg://assessment:assessment@assessment-db:5432/assessment_db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      assessment-db:
        condition: service_healthy

  assessment-service:
    build:
      context: ./services/assessment-service
    environment:
      DATABASE_URL: postgresql+psycopg://assessment:assessment@assessment-db:5432/assessment_db
      JWT_JWKS_URL: ${JWT_JWKS_URL:-http://identity-service:8000/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-smart-education-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smart-education-platform}
      ACADEMIC_SERVICE_BASE_URL: ${ACADEMIC_SERVICE_BASE_URL:-http://academic-service:8000}
      NOTIFICATION_SERVICE_BASE_URL: ${NOTIFICATION_SERVICE_BASE_URL:-http://notification-service:8000}
      NOTIFICATION_INTERNAL_EVENT_TOKEN: ${NOTIFICATION_INTERNAL_EVENT_TOKEN:-change-me}
    ports:
      - "8008:8000"
    depends_on:
      assessment-migrate:
        condition: service_completed_successfully

volumes:
  assessment_postgres_data:
