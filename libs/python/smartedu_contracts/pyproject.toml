[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartedu-contracts"
version = "0.1.0"
description = "Cross-service HTTP, event, context, resilience, idempotency and internal-auth contracts for Smart Education Platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
