[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartedu-testkit"
version = "0.1.0"
description = "Shared testing utilities for Smart Education Platform."
requires-python = ">=3.11"
dependencies = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "PyJWT>=2.9,<3",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
