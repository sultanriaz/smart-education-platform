[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartedu-observability"
version = "0.1.0"
description = "Metrics, structured logging, tracing, and operational instrumentation for Smart Education Platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1",
  "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
