[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartedu-infra"
version = "0.1.0"
description = "Data, messaging, cache, object storage, retention, and database infrastructure helpers for Smart Education Platform."
requires-python = ">=3.11"
dependencies = [
  "smartedu-contracts==0.1.0",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "redis>=5,<7",
  "aio-pika>=9.4,<10",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
