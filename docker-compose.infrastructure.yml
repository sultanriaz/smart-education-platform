name: smartedu-infrastructure

services:
  infra-postgres:
    image: postgres:16-alpine
    container_name: smartedu-infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: postgres

      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?ACADEMIC_DB_PASSWORD is required}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?ATTENDANCE_DB_PASSWORD is required}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:?SCHEDULING_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      FACILITY_DB_PASSWORD: ${FACILITY_DB_PASSWORD:?FACILITY_DB_PASSWORD is required}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD:?LEARNING_DB_PASSWORD is required}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?ASSESSMENT_DB_PASSWORD is required}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - smartedu-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - smartedu-backend

  redis-cache:
    image: redis:7.4-alpine
    container_name: smartedu-redis-cache
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_CACHE_HOST_PORT:-56379}:6379"
    volumes:
      - ./infra/redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - smartedu-backend

  redis-durable:
    image: redis:7.4-alpine
    container_name: smartedu-redis-durable
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_DURABLE_HOST_PORT:-56380}:6379"
    volumes:
      - smartedu-redis-durable-data:/data
      - ./infra/redis/durable.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - smartedu-backend

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: smartedu-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartedu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: smartedu
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - smartedu-rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - smartedu-backend

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: smartedu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartedu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_HOST_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - smartedu-minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - smartedu-backend

  minio-bootstrap:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: smartedu-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartedu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      LEARNING_S3_SECRET: ${LEARNING_S3_SECRET:?LEARNING_S3_SECRET is required}
      PLATFORM_S3_SECRET: ${PLATFORM_S3_SECRET:?PLATFORM_S3_SECRET is required}
      REPORTING_S3_SECRET: ${REPORTING_S3_SECRET:?REPORTING_S3_SECRET is required}
    volumes:
      - ./infra/minio/bootstrap-security.sh:/bootstrap.sh:ro
      - ./infra/minio/policies:/policies:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
    networks:
      - smartedu-backend

volumes:
  smartedu-postgres-data:
  smartedu-redis-durable-data:
  smartedu-rabbitmq-data:
  smartedu-minio-data:

networks:
  smartedu-backend:
    name: smartedu-backend
    driver: bridge
