version: 1
services:
  identity:
    gateway_prefix: /api/v1/identity
    required_paths:
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
    - /api/v1/users/me
    sprint18_paths:
    - /api/v1/auth/password/forgot
    - /api/v1/auth/password/reset
    - /api/v1/auth/email/verification/request
    - /api/v1/auth/email/verification/confirm
  academic:
    gateway_prefix: /api/v1/academic
    required_resources:
    - departments
    - programs
    - academic-years
    - semesters
    - courses
    - sections
    - enrollments
    - teacher-assignments
  attendance:
    gateway_prefix: /api/v1/attendance
    required_resources:
    - sessions
    - records
  scheduling:
    gateway_prefix: /api/v1/scheduling
    required_resources:
    - schedules
  notifications:
    gateway_prefix: /api/v1/notifications
    required_resources:
    - notifications
    - preferences
  facilities:
    gateway_prefix: /api/v1/facilities
    required_resources:
    - facilities
    - bookings
  learning:
    gateway_prefix: /api/v1/learning
    required_resources:
    - categories
    - resources
  assessments:
    gateway_prefix: /api/v1/assessments
    required_resources:
    - banks
    - questions
    - quizzes
    - assignments
    - attempts
  reporting:
    gateway_prefix: /api/v1/reporting
    required_resources:
    - dashboard
    - reports
  platform:
    gateway_prefix: /api/v1/platform
    required_resources:
    - audit
    - jobs
