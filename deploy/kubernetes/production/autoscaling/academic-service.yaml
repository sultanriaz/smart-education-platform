apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: academic-service
  namespace: smartedu
  labels:
    smartedu.io/component: academic-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: academic-service
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
