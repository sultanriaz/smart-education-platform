apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartedu-staging
  labels: &id001
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: smart-education-platform
    smartedu.io/component: api-gateway
    smartedu.io/tier: app
    smartedu.io/environment: staging
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      smartedu.io/component: api-gateway
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'false'
        prometheus.io/path: /metrics
        prometheus.io/port: '8080'
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: smartedu.local/api-gateway:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: smartedu-staging-runtime
        - secretRef:
            name: api-gateway-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: nginx-cache
        emptyDir:
          sizeLimit: 128Mi
      - name: nginx-run
        emptyDir:
          sizeLimit: 16Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            smartedu.io/component: api-gateway
