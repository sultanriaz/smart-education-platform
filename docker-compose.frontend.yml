services:
  frontend:
    build:
      context: ./apps/frontend
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8080}
      APP_NAME: ${FRONTEND_APP_NAME:-Smart Education Platform}
      ENABLE_HSTS: ${FRONTEND_ENABLE_HSTS:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped
