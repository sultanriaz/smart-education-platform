services:
  identity-db:
    image: postgres:16
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5434:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ./services/identity-service
    environment:
      APP_NAME: Smart Education Identity Service
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://identity:identity@identity-db:5432/identity_db
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY_FILE: /run/secrets/identity_jwt_private_key
      JWT_KEY_ID: identity-dev-1
      JWT_ISSUER: http://localhost:8001
      JWT_ACCESS_AUDIENCE: smart-education-api
      JWT_REFRESH_AUDIENCE: identity-service
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 14
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8001:8000"
    secrets:
      - identity_jwt_private_key
    depends_on:
      identity-db:
        condition: service_healthy

volumes:
  identity_postgres_data:

secrets:
  identity_jwt_private_key:
    file: ./services/identity-service/.secrets/identity-private.pem

