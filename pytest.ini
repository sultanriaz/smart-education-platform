[pytest]
markers =
    architecture: static architecture/service-boundary checks
    live: tests that require running services
    postgres: tests that require PostgreSQL
    rabbitmq: tests that require RabbitMQ
    redis: tests that require Redis
    minio: tests that require S3/MinIO
    concurrency: race-condition tests
    contract: API/event contract tests
    security: authorization/security regression tests
addopts = -ra --import-mode=importlib
