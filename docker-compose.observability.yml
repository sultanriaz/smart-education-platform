services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-35d}
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - smartedu-backend
      - observability
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
    security_opt:
      - no-new-privileges:true

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.2.1}
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.2.1}
    profiles: ["logs"]
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/var/lib/promtail
    networks:
      - observability
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.6.1}
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.114.0}
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./infra/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-14318}:4318"
    networks:
      - smartedu-backend
      - observability
    depends_on:
      - tempo
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
  promtail-positions:

networks:
  smartedu-backend:
    external: true
    name: smartedu-backend
  observability:
    name: smartedu-observability
